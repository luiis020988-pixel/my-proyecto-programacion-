<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <style>
        .carousel {
            position: relative;
            max-width: 800px;
            margin: auto;
            overflow: hidden;
            border-radius: 5px;
        }

        .carousel-images {
            display: flex;
            transition: transform 0.5s ease;
        }

        .carousel img {
            width: 100%;
            max-width: 800px;
            border-radius: 5px;
        }

        .carousel button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.8);
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .carousel .prev {
            left: 10px;
        }

        .carousel .next {
            right: 10px;
        }
    </style>
</head>
<body>

        <h1>Bienvenido a Mi Página Web</h1>

                <li><a href="contacto.php">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section>
        <h2>Galería</h2>
        <div class="carousel">
            <button class="prev" onclick="moveSlide(-1)">&#10094;</button>
            <div class="carousel-images" id="carouselImages">
                <img src="a1.jpg" alt="Imagen 1" width="150" height="200">
                <img src="a2.jpg" alt="Imagen 2" width="150" height="200">
                <img src="a3.jpg" alt="Imagen 3" width="150" height="200">
                <img src="a4.jpg" alt="Imagen 4" width="150" height="200">
                <img src="a5.jpg" alt="Imagen 5" width="150" height="200">
                <img src="a5.jpg" alt="Imagen 6" width="150" height="200">
                
                <img src="a5.jpg" alt="Imagen 6" width="150" height="200">
            </div>
            <button class="next" onclick="moveSlide(1)">&#10095;</button>
        </div>
    </section>

    <script>
        let currentSlide = 0;

        function moveSlide(direction) {
            const slides = document.querySelectorAll('.carousel-images img');
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            const offset = -currentSlide * 100;
            document.getElementById('carouselImages').style.transform = `translateX(${offset}%)`;
        }
    </script>
</body>
